name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Queue overlapping runs instead of cancelling: never interrupt an in-flight publish.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  id-token: write  # required for npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment` here on purpose: npm Trusted Publisher config must use
    # the exact same environment name. Adding one without coordinating the
    # npmjs.com side would silently break OIDC publishing.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Omit registry-url / NODE_AUTH_TOKEN: setup-node writes an empty
          # _authToken into .npmrc, which can block OIDC authentication.
          package-manager-cache: false

      - name: Ensure npm CLI supports OIDC
        run: npm install -g npm@^11.5.1

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      # Keep the tag gate identical to the local baseline in docs/plan.md §3.
      - run: npm test
      - run: npm run check
      - run: npm run typecheck
      - run: npm pack --dry-run

      - name: Publish with OIDC
        run: npm publish --access public
